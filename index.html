<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e1117">
  <title>Forced to Wipe</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/classes.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <img id="brand-logo" class="brand-logo" alt="" hidden>
    <div>
      <h1 id="brand-title" class="brand-title">Forced to Wipe</h1>
      <p id="brand-sub" class="brand-sub"></p>
    </div>
  </header>

  <div id="stale-banner" class="banner" role="status" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer">
    <p id="updated" class="muted small">Loading…</p>
    <div class="footer-row">
      <button id="refresh" class="btn" type="button">Refresh</button>
      <nav class="exports" aria-label="CSV export">
        <a href="api/export/roster.csv">Roster CSV</a>
        <a href="api/export/stats.csv">Stats CSV</a>
        <a href="api/export/levelups.csv">Level-ups CSV</a>
      </nav>
    </div>
    <p id="refresh-status" class="small" role="status" aria-live="polite"></p>
  </footer>

  <nav class="tabbar" aria-label="Main">
    <a href="#/roster" data-route="roster">Roster</a>
    <a href="#/stats" data-route="stats">Stats</a>
    <a href="#/levelups" data-route="levelups">Level-ups</a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
