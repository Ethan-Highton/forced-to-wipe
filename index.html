<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#100e0d">
  <meta name="description" content="Forced to Wipe: guild roster, stats and level-ups for a WoW Forever guild.">
  <meta property="og:title" content="Forced to Wipe">
  <meta property="og:description" content="Guild roster, stats and level-ups for a WoW Forever guild.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="css/img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="css/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="css/img/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Forced to Wipe">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Forced to Wipe</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/stats.css">
  <link rel="stylesheet" href="css/member.css">
  <link rel="stylesheet" href="css/classes.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <img id="brand-logo" class="brand-logo" alt="" hidden>
      <div class="brand-text">
        <h1 id="brand-title" class="brand-title">Forced to Wipe</h1>
        <p id="brand-sub" class="brand-sub"></p>
      </div>
    </div>

    <nav class="topnav" aria-label="Main">
      <a href="#/roster" data-route="roster">Roster</a>
      <a href="#/stats" data-route="stats">Stats</a>
      <a href="#/levelups" data-route="levelups">Level-ups</a>
    </nav>

    <div class="actions">
      <div class="actions-row">
        <button id="refresh" class="btn" type="button">Refresh</button>
        <details id="export-menu" class="export">
          <summary>Export</summary>
          <div class="export-list">
            <a href="api/export/roster.csv">Roster CSV</a>
            <a href="api/export/stats.csv">Stats CSV</a>
            <a href="api/export/levelups.csv">Level-ups CSV</a>
          </div>
        </details>
      </div>
      <p id="refresh-status" class="refresh-status" role="status" aria-live="polite"></p>
    </div>
  </header>

  <div id="stale-banner" class="banner" role="status" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer">
    <p id="updated" class="muted small">Loading</p>
    <nav class="exports" aria-label="CSV export">
      <a href="api/export/roster.csv">Roster CSV</a>
      <a href="api/export/stats.csv">Stats CSV</a>
      <a href="api/export/levelups.csv">Level-ups CSV</a>
    </nav>
  </footer>

  <nav class="tabbar" aria-label="Main">
    <a href="#/roster" data-route="roster">Roster</a>
    <a href="#/stats" data-route="stats">Stats</a>
    <a href="#/levelups" data-route="levelups">Level-ups</a>
  </nav>

  <script type="module" src="js/pwa.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
